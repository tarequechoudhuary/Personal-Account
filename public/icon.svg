<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="99" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Ledger Book Container -->
  <g filter="url(#dropShadow)">
    <!-- Book back/spine -->
    <rect x="120" y="105" width="272" height="302" rx="24" fill="#ffffff" />
    <!-- Book spine highlight -->
    <rect x="120" y="105" width="36" height="302" rx="12" fill="#e2e8f0" />
    <line x1="156" y1="105" x2="156" y2="407" stroke="#cbd5e1" stroke-width="3" />

    <!-- Ruled lines -->
    <line x1="180" y1="165" x2="360" y2="165" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="180" y1="205" x2="330" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="180" y1="240" x2="350" y2="240" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="180" y1="275" x2="310" y2="275" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Taka / Coin Badge -->
  <circle cx="340" cy="330" r="62" fill="url(#goldGrad)" filter="url(#dropShadow)" />
  <circle cx="340" cy="330" r="50" fill="none" stroke="#fef3c7" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Bengali Taka symbol ৳ -->
  <text x="340" y="354" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#ffffff" text-anchor="middle">৳</text>
</svg>
